name = "Ghostty"
description = "GPU-accelerated terminal emulator"
depends = ["jetbrains-mono-nerd"]

[install.fedora]
pre = ["sudo dnf copr enable -y scottames/ghostty"]
dnf = ["ghostty"]

[install.arch]
pacman = ["ghostty"]

[install.macos]
cask = ["ghostty"]

[[settings]]
source = "config.ghostty"
target = "~/.config/ghostty/config.ghostty"

name = "zsh"
description = "Z shell with autosuggestions and syntax highlighting; becomes your login shell"

[install.fedora]
dnf = ["zsh", "zsh-autosuggestions", "zsh-syntax-highlighting"]
post = ['sudo usermod -s "$(command -v zsh)" "$USER"']

[install.arch]
pacman = ["zsh", "zsh-autosuggestions", "zsh-syntax-highlighting"]
post = ['sudo usermod -s "$(command -v zsh)" "$USER"']

# macOS ships zsh in /bin (the only zsh chsh accepts without editing /etc/shells).
[install.macos]
brew = ["zsh-autosuggestions", "zsh-syntax-highlighting"]
post = ['sudo chsh -s /bin/zsh "$USER"']

# Counts as installed only while zsh is your login shell.
[check]
login_shell = "zsh"

[[settings]]
source = "zshrc"
target = "~/.zshrc"

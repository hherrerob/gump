name = "RPM Fusion"
description = "Free + nonfree RPM Fusion repositories (codecs, drivers, Steam)"

[install.fedora]
script = '''
sudo dnf install -y \
  "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm" \
  "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm"
'''

[check]
shell = "rpm -q rpmfusion-free-release rpmfusion-nonfree-release"

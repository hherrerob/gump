name = "PlatformIO"
description = "Embedded toolchain for ESP32 and friends (pio CLI + VS Code extensions)"
# The PlatformIO and Wokwi extensions need VS Code, so it comes along.
depends = ["vscode"]

# Fedora: installed as a uv tool, plus udev rules and the dialout group for serial access.
[install.fedora]
script = '''
set -e
command -v uv >/dev/null || sudo dnf install -y uv
uv tool install platformio
curl -fsSL https://raw.githubusercontent.com/platformio/platformio-core/develop/platformio/assets/system/99-platformio-udev.rules \
  | sudo tee /etc/udev/rules.d/99-platformio-udev.rules >/dev/null
sudo udevadm control --reload-rules
sudo udevadm trigger
sudo usermod -aG dialout "$USER"
'''

[install.arch]
pacman = ["platformio-core", "platformio-core-udev"]
post = ['sudo usermod -aG uucp "$USER"']

[install.macos]
brew = ["platformio"]

[check]
command = "pio"
path = "~/.local/bin/pio"

# Extensions count as settings: installed even when PlatformIO already is, skipped with --agnostic.
[extras.fedora]
vscode = ["platformio.platformio-ide", "wokwi.wokwi-vscode"]

[extras.arch]
vscode = ["platformio.platformio-ide", "wokwi.wokwi-vscode"]

[extras.macos]
vscode = ["platformio.platformio-ide", "wokwi.wokwi-vscode"]

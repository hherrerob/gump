name = "Neovim"
description = "Terminal editor, with my config directory"

[install.fedora]
dnf = ["neovim"]

[install.arch]
pacman = ["neovim"]

[install.macos]
brew = ["neovim"]

# A directory source: every file under nvim/ is copied into ~/.config/nvim/.
[[settings]]
source = "nvim"
target = "~/.config/nvim"

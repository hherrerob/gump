name: release

# Every push to main publishes a rolling "latest" release, so editing the catalog and pushing
# is all it takes for bootstrap.sh to pick up the new binary on the next fresh install.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: gump-linux-x86_64, cross: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, asset: gump-linux-aarch64, cross: true }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: gump-macos-arm64, cross: false }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: gump-macos-x86_64, cross: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build (cross)
        if: matrix.cross
        run: |
          cargo install cross --locked
          cross build --release --target ${{ matrix.target }}
      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/gump ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/* --target "$GITHUB_SHA" --title "latest" \
            --notes "Rolling build of ${GITHUB_SHA::7}. Install: curl -fsSL https://raw.githubusercontent.com/${GH_REPO}/main/bootstrap.sh | sh"

[package]
name = "gump"
version = "0.1.0"
edition = "2021"
description = "Idempotent setup wizard for fresh Fedora, Arch and macOS installs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
dirs = "5"
include_dir = "0.7"
libc = "0.2"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
which = "6"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
